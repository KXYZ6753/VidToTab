appId: com.vidtotab.app
productName: VidToTab
directories:
  output: dist

# Drawn by scripts/make-icon.mjs (npm run icon) rather than committed, because
# build/ is not in git. Each platform takes a real multi-resolution container
# rather than one 1024px png, because the small sizes are not the big one shrunk:
# below 48px the mark drops to the brand kit's three-string variant, which is the
# only way its taper survives a 16px slot. The png stays as a fallback for
# anything that asks for the generic key.
icon: build/icon.png

# Only the shell goes in the asar. The server stays outside it: it spawns child
# processes and reads its own files, both of which are unhappy inside an archive.
files:
  - electron/**/*
  - package.json

extraResources:
  # ffmpeg/ffprobe, fetched and checksum-verified by scripts/fetch-binaries.mjs.
  # The resolver looks here first, which is what makes the app work on a machine
  # that has never had Homebrew — i.e. almost every machine it will be
  # downloaded onto. The macOS build is a shared one, so its dylibs travel in
  # the same folder as the executables.
  - from: build/bin/${platform}-${arch}
    to: bin
  - from: server.js
    to: app/server.js
  - from: pipeline
    to: app/pipeline
  - from: public
    to: app/public
  # Marks the packaged server as ESM. Without it Node reads server.js as
  # CommonJS and every import throws.
  - from: electron/server-package.json
    to: app/package.json
  # The server's only runtime dependency, plus its own dependencies. The
  # packaged smoke test imports it for real, so a missing one fails loudly
  # rather than at the moment a user first exports a PDF.
  - from: node_modules/pdf-lib
    to: app/node_modules/pdf-lib
  - from: node_modules/@pdf-lib
    to: app/node_modules/@pdf-lib
  - from: node_modules/pako
    to: app/node_modules/pako
  - from: node_modules/tslib
    to: app/node_modules/tslib

mac:
  category: public.app-category.music
  icon: build/icon.icns
  # Ad-hoc signing, explicitly. Not decoration: every Mach-O binary on Apple
  # Silicon has to carry a signature to run at all, and an app that ships
  # without one is reported as "damaged and can't be opened" — an error with no
  # right-click-Open escape, unlike the unidentified-developer warning. What
  # arrives unsigned is the linker's own signature on the Electron binary
  # (Identifier=Electron, no sealed resources), which codesign --verify rejects.
  identity: '-'
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

linux:
  # A directory of <n>x<n>.png, which is the shape electron-builder globs for.
  icon: build/icons
  category: AudioVideo
  # .deb is the primary download: AppImage needs chmod +x and trips Ubuntu's
  # AppArmor sandbox, which is a poor first experience for a non-developer.
  target:
    - target: deb
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64]
