name: CI

on:
  push:
    branches: [main]
    # A tag is what turns a run into a release: same matrix, same checks,
    # installers instead of an unpacked tree, and a job at the end that
    # publishes them. Nothing else about a tagged run is different, which is
    # the point — what gets released is what CI already proved.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The point of this matrix is the two platforms that cannot be checked on the
# machine this was written on. A macOS build proves very little about whether
# the Windows and Linux apps start at all, find their bundled ffmpeg, or shut
# down without leaving a server running.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macOS (arm64) }
          - { os: windows-latest, name: Windows (x64) }
          - { os: ubuntu-24.04, name: Linux (x64) }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      # A tag and a package.json that disagree produce installers named after
      # the wrong version, and nobody notices until someone reports a download
      # whose name does not match what they clicked. `npm version` moves both
      # together; this catches a tag made by hand that did not.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag $tag, package.json $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg. Use 'npm version <patch|minor|major>' so the two cannot drift."
            exit 1
          fi

      # Electron needs these to open a window, and the packaged-app test opens
      # one. Xvfb gives the runner a display to open it on.
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 libgbm1

      - run: npm ci

      # Must come before the tests. The module self-checks are not pure: ffmpeg.js
      # and index.js encode real clips with ffmpeg, and a runner has none
      # installed. This also checksum-verifies the pinned build, so a tampered or
      # swapped upload fails here rather than shipping.
      - name: Fetch bundled binaries
        run: npm run binaries

      # The Linux release ships a .deb for arm64 as well as x64, and each one
      # takes its ffmpeg from build/bin/linux-<arch> — a directory the plain
      # fetch, which only ever gets the architecture it is running on, does not
      # create for the other one. An ordinary run never notices, because --dir
      # only packages the architecture it is running on either. A release is the
      # first time the second one is asked for, and it would fail there with a
      # missing extraResources path. The script's own header says --all is what
      # CI needs; this is the run that needs it.
      - name: Fetch every architecture's binaries (Linux release)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: npm run binaries -- --all

      - name: Put the bundled binaries on PATH
        shell: bash
        run: node -e "console.log(require('path').join(process.cwd(),'build','bin',process.platform+'-'+process.arch))" >> "$GITHUB_PATH"

      # The server checks drive the real URL flow, and it refuses to start at all
      # without yt-dlp. A runner has none, so one check was measuring that
      # refusal rather than the thing it meant to test — and a machine with no
      # yt-dlp is not what this app runs on anyway. Fetched with the project's
      # own installer, so it is checksum-verified like everything else, into the
      # directory already added to PATH above.
      - name: Fetch yt-dlp for the tests
        run: node -e "const p=require('path');import('./pipeline/ytdlp.js').then(m=>m.ensureYtDlp({binDir:p.join(process.cwd(),'build','bin',process.platform+'-'+process.arch),onLog:console.log}))"

      - name: Module self-checks
        run: npm test

      - name: Server checks
        run: npm run test:server

      # `npm run pack` draws the icon itself — build/ is not in git, and an
      # explicit icon path makes electron-builder hard-error when it is absent,
      # so a fresh clone has to work without a separate step here.
      #
      # --dir on an ordinary run: the packaged checks below only need the
      # unpacked tree, and building five installers on every push would cost
      # minutes for something nobody downloads. A tag builds the real thing.
      #
      # Signing is switched off explicitly. There is no certificate in this
      # repo, and left to itself electron-builder goes looking for one in the
      # runner's empty keychain and fails the release rather than shipping
      # unsigned. Unsigned is a real cost — see the install notes the release
      # job writes — but a failed release is worse.
      - name: Build the app
        run: npm run ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'pack' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Electron refuses to start rather than run unsandboxed, and an *unpacked*
      # Linux build ships chrome-sandbox without its setuid bit. Installing the
      # .deb sets it, so this only ever affects testing the unpacked tree. Set it
      # here rather than passing --no-sandbox, so what gets tested is sandboxed
      # the same way a real install is.
      - name: Give chrome-sandbox its setuid bit (unpacked build only)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox

      # The one that matters: does the built app actually start, serve, and
      # leave nothing running when it is closed.
      - name: Packaged app checks
        if: runner.os != 'Linux'
        run: npm run test:app:packaged

      - name: Packaged app checks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:app:packaged

      # Nothing should outlive the app. A leftover ffmpeg or yt-dlp here means
      # killTree missed a grandchild.
      - name: No orphaned processes
        if: runner.os != 'Windows'
        run: |
          # -x matches the process name exactly, like the Windows step below.
          # -f matched whole command lines, so anything merely mentioning the
          # repo counted as an orphan — on Linux the workspace path itself is
          # /home/runner/work/VidToTab/VidToTab. Measured locally: -f found 3
          # processes where -x found 0.
          left=$(pgrep -x 'ffmpeg|ffprobe|yt-dlp|VidToTab' || true)
          if [ -n "$left" ]; then echo "orphans left behind:"; ps -p $left || true; exit 1; fi
          echo "none"

      # The same check on Windows, which had none: there is no pgrep here, so the
      # step above skips the one platform whose kill path is different code
      # (taskkill /PID <pid> /T /F rather than signalling a process group). The
      # tree-kill most likely to miss a grandchild was the one nothing looked at.
      #
      # -Name matches the image name exactly — ffmpeg.exe is "ffmpeg", and both
      # the shell and the server it spawns are VidToTab.exe — never a path or a
      # command line, so the workspace being D:\a\VidToTab\VidToTab cannot make
      # this fire on its own. -ErrorAction SilentlyContinue is load-bearing, not
      # decoration: the step runs with $ErrorActionPreference = 'stop', so
      # without it "no such process" is a terminating error and a clean runner
      # fails here. exit 1 is explicit because a non-empty result is not an
      # error PowerShell would raise by itself.
      - name: No orphaned processes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $left = @(Get-Process -Name 'ffmpeg','ffprobe','yt-dlp','VidToTab' -ErrorAction SilentlyContinue)
          if ($left.Count -gt 0) {
            Write-Host 'orphans left behind:'
            foreach ($p in $left) {
              $path = $(try { $p.Path } catch { '(path unavailable)' })
              Write-Host ('  {0} pid {1} {2}' -f $p.ProcessName, $p.Id, $path)
            }
            exit 1
          }
          Write-Host 'none'

      # Only the things a person downloads. electron-builder also writes
      # .blockmap and latest*.yml next to them, which exist for auto-update;
      # this app has none, so they would be noise on the release page. Add them
      # here if electron-updater is ever wired in.
      #
      # if-no-files-found: error is the important line. A release that publishes
      # nothing looks exactly like a release that worked.
      - name: Keep the installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.AppImage

      - name: Keep the build for inspection
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist
          retention-days: 5

  # The hosted half. Docker is not runnable on the machine this was written on,
  # so this job is the only thing that proves the image builds, starts as a
  # non-root user, finds its bundled ffmpeg and answers the health check a
  # platform would poll. Nothing is pushed anywhere — the image is built, run,
  # and thrown away with the runner.
  web-image:
    name: Web image (linux/amd64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Plain docker build rather than docker/build-push-action: the runner
      # already has a daemon, nothing here is pushed or cached across runs, and
      # this owes nothing to a third-party action's release schedule.
      - name: Build the image
        run: docker build -t vidtotab:ci .

      # VIDTOTAB_PUBLIC=1 so the run exercises the limited configuration, which
      # is the one a public instance actually uses.
      - name: Start the container
        run: docker run -d --name vidtotab -p 3000:3000 -e VIDTOTAB_PUBLIC=1 vidtotab:ci

      - name: It answers /api/health
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:3000/api/health) && break
            sleep 2
          done
          echo "health: $body"
          # ok:false would mean the bundled ffmpeg is not where tools.js looks.
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"mode":"web"'
          echo "$body" | grep -q '"public":true'

      - name: It serves the app
        run: curl -fsS -o /dev/null http://127.0.0.1:3000/

      - name: It does not run as root
        run: |
          who=$(docker exec vidtotab id -un)
          echo "running as: $who"
          [ "$who" != root ]

      # The HEALTHCHECK in the image, as Docker itself evaluates it — a platform
      # restarting the container in a loop is the failure this catches.
      - name: Docker agrees the container is healthy
        run: |
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' vidtotab)
            [ "$s" = healthy ] && break
            [ "$s" = unhealthy ] && break
            sleep 3
          done
          echo "health status: $s"
          [ "$s" = healthy ]

      - name: Container log
        if: always()
        run: docker logs vidtotab || true

      - name: Stop the container
        if: always()
        run: docker rm -f vidtotab || true

  # Turning a green matrix into downloads. Gated on both jobs above, because a
  # tag is the one moment you most want everything green — change `needs` to
  # just [build] if a broken Dockerfile should not be able to hold up a desktop
  # release.
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web-image]
    runs-on: ubuntu-24.04
    permissions:
      # The default token is read-only. Creating a release is a write, and this
      # is the only job in the file that needs one.
      contents: write

    steps:
      # Full history, because the notes below diff this tag against the previous
      # one and a shallow clone has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect the installers
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      - name: What is about to be published
        run: ls -lh artifacts

      - name: Write the notes
        shell: bash
        run: |
          # --match 'v*' on purpose: this repo also carries milestone tags
          # (pre-remaster, remaster-1) that are not releases, and without the
          # filter the first release would list every commit since one of those.
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo '## Install'
            echo
            echo 'Nothing else is needed — ffmpeg, ffprobe and yt-dlp travel inside the app.'
            echo
            echo '**macOS** (Apple Silicon) — the `.dmg`. Open it and drag VidToTab to Applications.'
            echo
            echo 'It is not signed with an Apple Developer certificate, so macOS refuses the first launch and calls the app damaged. It is not: right-click it and choose **Open**, or run'
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine /Applications/VidToTab.app'
            echo '```'
            echo
            echo '**Windows** (x64) — `VidToTab Setup *.exe`. Also unsigned, so SmartScreen will warn: **More info** then **Run anyway**.'
            echo
            echo '**Linux** — the `.deb` for Debian and Ubuntu, x64 or arm64:'
            echo
            echo '```sh'
            echo 'sudo apt install ./VidToTab_*_amd64.deb'
            echo '```'
            echo
            echo 'or the x64 `.AppImage`, which needs `chmod +x` before it will start.'
            echo
            echo '## Changes'
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..${GITHUB_REF_NAME}"
              echo
              echo "[Everything that changed](https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME})"
            else
              echo '- First release.'
            fi
          } > notes.md
          cat notes.md

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag with a suffix — v1.2.0-beta.1 — is published as a pre-release,
          # so "Latest release" on the repo page keeps pointing at the last
          # stable one.
          case "$GITHUB_REF_NAME" in
            *-*) pre=--prerelease ;;
            *)   pre= ;;
          esac

          # Re-running a failed release job is normal, and `gh release create`
          # refuses when the release already exists. Replace its files and notes
          # instead of failing at the last step with the builds already done.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — replacing its files"
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md $pre
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "VidToTab ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              --verify-tag \
              $pre
          fi
          echo "published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
